# Secret scan: run gitleaks over the full git history on every pull request
# and every push to main. The job name "Gitleaks" is the required status check name.
#
# This uses the gitleaks binary, not gitleaks-action. gitleaks-action needs a
# GITLEAKS_LICENSE secret for repositories owned by an organization.
# The binary is MIT licensed and needs no key.
#
# To update gitleaks: change GITLEAKS_VERSION and GITLEAKS_SHA256 together.
# Take the SHA-256 from gitleaks_<version>_checksums.txt on the release page.
# Dependabot does not update this binary.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Exit code 1 fails the job when a secret is found. --redact keeps the
      # secret value out of the log. A false positive goes in .gitleaksignore.
      - name: Scan the git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --verbose .
