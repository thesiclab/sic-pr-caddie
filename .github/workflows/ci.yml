# CI for sic-pr-caddie: run the offline unittest suites. The README promises
# Python 3.8 or later, so the matrix covers 3.8, 3.12 and 3.15.
# ubuntu-24.04 is named on purpose: the Python 3.8 build from setup-python
# exists for Ubuntu 24.04 and not for 26.04.
# Required status check names:
#   "Test (Python 3.8)", "Test (Python 3.12)" and "Test (Python 3.15)"
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per pull request or branch. A newer push cancels an older run on a
# pull request. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12", "3.15"]
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Standard library only: nothing to install. Same command as AGENTS.md.
      - name: Run the tests
        run: python -m unittest -v
